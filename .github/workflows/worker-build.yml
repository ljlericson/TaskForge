name: TaskForge Worker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake g++ python3

    - name: Bootstrap vcpkg
      run: |
        cd worker/vcpkg
        ./bootstrap-vcpkg.sh

    - name: Install vcpkg packages
      run: |
        cd worker/vcpkg
        ./vcpkg install

    - name: Build worker
      run: |
        cd worker
        sh build-worker.sh
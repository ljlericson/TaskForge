<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>TaskForge</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- JS -->
  <script type="module" src="./js/api.js"></script>
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/jobs.js"></script>
  <script type="module" src="./js/workers.js"></script>
  <script type="module" src="./js/ui.js"></script>
</head>

<!-- Main content -->

<main>
  <!-- <div class="logo">
    <img src="assets/un.svg.png">
  </div> -->

  <div class="jobFormTitle">
    <h2>Job Creator</h2>
  </div>

  <div class="jobForm">
    <form id="newJob">
      <fieldset>
        <legend>Preliminary Info</legend>
        <label for="serverIP">TaskForge Server IP</label>
        <input id="serverIP" />
        <br>
        <label for="jobName">Job Name</label>
        <input id="jobName" />
        <br>
        <label for="timeoutSeconds">Timeout (seconds)</label>
        <input id="timeoutSeconds" />
        <br>
        <label for="priority">Priority</label>
        <input id="priority" />
      </fieldset>

      <fieldset>
        <legend>Program Details</legend>
        <label for="jarURL">Jar URL</label>
        <input id="jarURL" />
        <br>
        <label for="jarMainClass">Jar Main Class</label>
        <input id="jarMainClass" />
        <br>
        <label for="jarArguments">Arguments</label>
        <input id="jarArguments" />
      </fieldset>

      <fieldset>
        <legend>Resources</legend>
        <label for="executionCores">Number of Execution Cores</label>
        <input id="executionCores" />
        <br>
        <label for="executionMemory">Memory for Execution (Mb)</label>
        <input id="executionMemory" />
      </fieldset>

      <fieldset>
        <legend>Data</legend>
        <label for="dataInput">Input Data URL</label>
        <input id="dataInput" />
        <br>
        <label for="dataOutput">Output Data URL</label>
        <input id="dataOutput" />
      </fieldset>

      <fieldset>
        <legend>Environment</legend>
        <label for="javaOpts">Java Opts</label>
        <input id="javaOpts" />
      </fieldset>

      <button id="submitJob">Create Job</button>
    </form>
  </div>
</main>

</html>
